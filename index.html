<title>華聯小隊</title>
<style>
:root{--ink:#1f2b3a;--sub:#6b7480;--gold:#c9a45c;--navy:#243244;--ok:#4f9a64;--work:#d29a3a;--err:#d4513f;--idle:#9aa1a9;--glass:rgba(255,255,255,.72);--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#e9ebee;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
#map{position:fixed;inset:0;touch-action:none;overflow:hidden}
#st{position:absolute;inset:0;width:100%;height:100%;display:block}
.who{cursor:pointer}
.ring{animation:breathe 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.ring.err{animation:breathe 1s ease-in-out infinite}.ring.idle{animation:none;opacity:.5}
@keyframes breathe{0%,100%{transform:scale(.9);opacity:.45}50%{transform:scale(1.08);opacity:.9}}
.hop{animation:hop2 1.6s infinite}
@keyframes hop2{0%,58%,100%{transform:translateY(0)}68%{transform:translateY(-16px)}78%{transform:translateY(0)}85%{transform:translateY(-6px)}92%{transform:translateY(0)}}
.bang{animation:bg 1.1s ease-in-out infinite}@keyframes bg{40%{transform:translateY(-10px)}}
.nm rect{fill:rgba(255,255,255,.88);stroke:rgba(36,50,68,.12);stroke-width:1.5}.nm text{fill:var(--ink);font-weight:700}
.nm.big rect{fill:#fff}.nm.big text{font-weight:800}
.bub{opacity:0;transition:opacity .35s}.bub.on{opacity:1}
.bub rect,.bub path{fill:#fff}.bub text{fill:var(--ink);font-weight:700}.bub tspan.n{fill:#b07d22;font-weight:800}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--safeT) + 12px) 16px 0;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
.brand{display:flex;flex-direction:column;line-height:1.15;padding:8px 16px;border-radius:18px;background:rgba(255,255,255,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 2px 10px rgba(30,40,60,.1)}
.brand b{font-size:20px;letter-spacing:.06em;color:var(--navy)}.brand span{font-size:12px;color:var(--sub);font-weight:600;margin-top:3px}
.status{display:flex;align-items:center;gap:7px;height:32px;padding:0 13px 0 11px;border-radius:999px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 2px 10px rgba(30,40,60,.10);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(79,154,100,.18)}
.status.err{color:#b23d2c}.status.err i{background:var(--err);box-shadow:0 0 0 3px rgba(212,81,63,.2);animation:hop 1.1s infinite}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-4px)}}
.menu{position:relative;width:44px;height:44px;border-radius:50%;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 2px 10px rgba(30,40,60,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.menu span{display:block;width:18px;height:2px;border-radius:2px;background:var(--navy)}
.menu b{position:absolute;right:-3px;top:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--err);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}
body:has(#mnu.on) #hud{z-index:12}
body:not(.dk) #mnu .mi{top:calc(var(--safeT) + 84px)!important;max-height:calc(100% - var(--safeT) - 100px)}
.lg-enter{border:0;width:100%;cursor:pointer;font:inherit}
body:not(.dk) #sheet{z-index:10}body:not(.dk):has(#sheet.on) #elevator{opacity:0;pointer-events:none}
#mnu{position:fixed;inset:0;z-index:11;background:rgba(31,43,58,.25);opacity:0;pointer-events:none;transition:opacity .25s}
#mnu.on{opacity:1;pointer-events:auto}
body.f1 #pill b,body.f1 #pill2 b,body.f1 #rost{display:none!important}
.musb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.92);color:#8a94a3;box-shadow:0 4px 14px rgba(30,40,60,.12);flex:none}.musb svg{width:19px;height:19px}.musb.on{background:var(--navy);color:#f2d79b}#hud .musb{margin-left:auto;margin-right:8px;pointer-events:auto}
#ppl .who>*:not(.hit),#ppl .who *{pointer-events:none}#ppl .who .hit{pointer-events:all;cursor:pointer}
#mnu .mtop{position:sticky;top:-8px;z-index:3;background:rgba(250,250,251,.97);margin:0;padding:12px 0 6px;box-shadow:0 0 0 18px rgba(250,250,251,.97);clip-path:inset(0 -18px);display:flex;align-items:center;justify-content:space-between;padding:6px 0 2px}#mnu .mtop b{font-size:17px;color:var(--ink)}#mnu .mtop .mx{position:static;float:none;margin:0}
#mnu .mcards{display:flex;flex-direction:column;gap:8px;padding:2px 0 8px}#mnu .mcards a{flex:none;display:block;border:0;padding:12px 12px 12px 14px;border-radius:16px;background:#fff;color:var(--ink);text-decoration:none;box-shadow:0 4px 14px rgba(30,40,60,.10);border-left:5px solid var(--c)}#mnu .mcards a small{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--c);margin:0}#mnu .mcards a b{display:block;font-size:14px;line-height:1.4;margin:2px 0 6px;font-weight:800;color:var(--ink)}#mnu .mcards a em{display:inline-block;font-style:normal;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,#fff)}
#mnu .mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 4px;padding:6px 0 10px}#mnu .mgrid a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;border:0;text-decoration:none;color:var(--ink);font-size:12.5px;font-weight:700;white-space:nowrap}#mnu .mgrid a:active .mic{transform:scale(.92)}
#mnu .mic{position:relative;width:62px;height:62px;border-radius:18px;background:#eef0f3;display:block;transition:transform .15s}#mnu .mic img{width:100%;height:100%;display:block;border-radius:18px}#mnu .mic i{position:absolute;right:-5px;top:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#e4574a;color:#fff;font:800 11px/20px system-ui;text-align:center;box-shadow:0 0 0 2px #fff}
